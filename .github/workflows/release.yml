name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      # Required for npm Trusted Publishing: npm exchanges this OIDC token for a
      # short-lived credential, so no NPM_TOKEN secret exists in this repository.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.17, above the 11.5.1 minimum for Trusted
          # Publishing. Node 22 still ships npm 10.9, which cannot do it.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify before publishing
        run: npm run verify
      - name: Publish
        run: npm publish
